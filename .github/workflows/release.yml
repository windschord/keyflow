name: Release

on:
  push:
    tags:
      - 'v*'

# 既定は最小権限（読み取りのみ）とし、必要なジョブでのみ昇格する。
permissions:
  contents: read

jobs:
  # US-019: WindowsはMicrosoft Store配布のみとしたため、本ジョブはStore提出用の
  # MSIX/AppXパッケージを生成する。GitHub Releaseには添付しない。
  # 未署名のAppXは利用者がそのままインストールできず（署名はStoreが行う）、
  # Partner Centerへアップロードするためだけの成果物であるため、
  # ワークフロー成果物としてのみ保管する。来歴証明はGitHubから公開配布する
  # 成果物（macOS）に付与するもので、本パッケージは対象外とする。
  build-windows:
    name: Microsoft Store Package Build
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      # ビルドジョブでは素の `npm ci` を用いる（`--ignore-scripts` にしない）。
      # electron（`postinstall` でバイナリ取得）・esbuild はビルド成立に
      # installスクリプトの実行を要するため。本ジョブは信頼できるタグpushのみで
      # 起動し、依存はlockfileに固定・アクションはSHAピン留めのため信頼境界は限定される。
      - name: Install dependencies
        run: npm ci

      - name: Build Microsoft Store package
        run: npm run build:win

      - name: Upload Store package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-package
          path: dist-electron/*.appx
          if-no-files-found: error

  build-macos:
    name: macOS Package Build
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      # build-windows と同じ理由で素の `npm ci` を用いる（上記コメント参照）。
      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npm run build:mac

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-electron/*.dmg
            dist-electron/*.zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-packages
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # 同一タグのリリースをWindows・macOSの両方で揃えるため、両ビルドの成功を必須とする。
    # US-019でGitHub Releaseの添付物はmacOS成果物のみになったが、build-windowsが失敗した
    # ままReleaseを公開すると、そのバージョンのStore提出用パッケージが存在しないまま
    # リリースが成立してしまうため、依存関係としては引き続き両方を待つ。
    needs: [build-windows, build-macos]
    timeout-minutes: 15
    # Release作成に必要な書き込み権限。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Release添付対象のmacOS成果物のみを取得する（Store提出用のAppXは添付しない）。
      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-packages
          path: artifacts

      # 入手者がファイル完全性を検証できるよう、Release添付物のSHA256チェックサムを生成する。
      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: sha256sum *.dmg *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # SemVerのプレリリース識別子を含むタグ（ハイフン付き、例: v0.1.0-rc.1）は
          # プレリリースとして作成し、通常版のlatestへ誤って露出させない。
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG \
            artifacts/*.dmg artifacts/*.zip artifacts/SHA256SUMS.txt
