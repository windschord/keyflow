appId: com.windschord.keyflow
productName: keyflow
copyright: Copyright © 2026

directories:
  output: dist-electron
  buildResources: build

# electron-builderによる自動npmRebuildを無効化する。
# ネイティブアドオンは使用していない（MIDIはRendererのWeb MIDI APIで処理）。
# opensheetmusicdisplayの依存関係であるheadless-gl（gl）は
# Electronレンダラーではブラウザ標準のCanvas/WebGLを使用するため
# 実行時に不要だが、node-gypでのネイティブビルドがElectron 42の
# V8 APIと非互換でリビルドに失敗するため、自動リビルド対象から外す。
npmRebuild: false

win:
  # US-019: WindowsはMicrosoft Store（MSIX/AppX）のみで配布する。
  # 未署名の.exeはWindows 11のスマート アプリ コントロール（SAC）に回避手段なくブロックされるため、
  # NSISインストーラー版・portable版のGitHub Releases配布は廃止した（US-018から変更）。
  # x64/arm64の2アーキテクチャ対応（REQ-018-001）はStoreパッケージ側で維持する。
  target:
    - target: appx
      arch: [x64, arm64]
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker

# macOSターゲット（TASK-035）
# 署名（codesign）・公証（Notarization）はスコープ外。未署名ビルドのため、
# 初回起動時にmacOS Gatekeeperの警告が表示されるが既知の制約として許容する。
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.music
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

# Microsoft Store配布用のMSIX/AppXパッケージ。
# 目的はWindows 11のスマートアプリコントロール（SAC）対策である。SACは未署名の実行ファイルを
# 回避手段なしにブロックするが、Store経由で配布されたアプリはMicrosoftが署名するため対象外となる。
# そのため本パッケージはローカルでは意図的に未署名のまま生成し、署名はStore側に委ねる
# （electron-builderは署名証明書が未設定のとき "Windows Store only build" として未署名で出力する）。
#
# ここに記載する3つの識別子はPartner Centerが発行した公開情報であり、秘密情報ではない
# （配布されるMSIXのAppxManifest.xmlに平文で埋め込まれ、誰でも参照できる）。
# Partner Centerの登録値と1文字でも異なるとStoreへの提出が拒否されるため、変更しないこと。
#
# AppXのビルドはWindows上でのみ可能（app-builder-lib: AppxTarget）。
# 他OSで `npm run build:win` を実行するとターゲット生成時にエラーとなる。
appx:
  identityName: windschrod.keyflow
  publisher: CN=AD71CC87-67F9-486A-A009-E3EA028C435D
  publisherDisplayName: winds chrod
  applicationId: keyflow
  displayName: keyflow
  # タイル画像（build/appx/*.png）の余白と馴染ませるため、アイコン背景と同じダークネイビーにする。
  backgroundColor: '#122036'
  # 先頭の言語がStore掲載の既定言語になる（US-016でUIはja/en対応済み）。
  languages:
    - ja-JP
    - en-US
  artifactName: ${productName}-Store-${version}-${arch}.${ext}

files:
  - out/**/*
  - '!node_modules/**/{CHANGELOG.md,README.md,readme.md}'
  - '!node_modules/**/*.{ts,map}'

publish: null
