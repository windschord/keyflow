name: Release

on:
  push:
    tags:
      - 'v*'

# 既定は最小権限（読み取りのみ）とし、必要なジョブでのみ昇格する。
permissions:
  contents: read

jobs:
  build-windows:
    name: Windows Installer Build
    runs-on: windows-latest
    timeout-minutes: 60
    # 成果物の来歴証明（build provenance attestation）生成に必要な最小権限。
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      # ビルドジョブでは素の `npm ci` を用いる（`--ignore-scripts` にしない）。
      # electron（`postinstall` でバイナリ取得）・esbuild・electron-winstaller は
      # ビルド成立にinstallスクリプトの実行を要するため。本ジョブは信頼できる
      # タグpushのみで起動し、依存はlockfileに固定・アクションはSHAピン留めのため
      # 信頼境界は限定される。来歴証明（attestation）で成果物の出所も検証可能にする。
      - name: Install dependencies
        run: npm ci

      # 署名の有無に関わらずアプリ本体のビルド（typecheck + electron-vite build）は共通。
      - name: Build application
        run: npm run build

      # 署名用GitHub Secretsが全て設定されている場合のみAzure Trusted Signingを有効化する。
      # 未設定（forkからの実行等）でも従来どおり未署名ビルドが成功することを保証するため、
      # ここでは判定のみ行い後続ステップの分岐に使う（ローカル `npm run build:win` は本判定の対象外で常に未署名）。
      - name: Check Azure Trusted Signing secrets
        id: check-azure-signing
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_SIGNING_PUBLISHER_NAME }}
        run: |
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] \
            && [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_SIGNING_ACCOUNT_NAME" ] \
            && [ -n "$AZURE_CERT_PROFILE_NAME" ] && [ -n "$AZURE_SIGNING_PUBLISHER_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Azure Trusted Signingで署名してパッケージング。
      # `-c.win.azureSignOptions.*` はelectron-builder CLIのドット記法によるconfigオーバーライドで、
      # electron-builder.ymlに秘密情報を書かないまま`win.azureSignOptions`を注入する
      # （`electron-builder --help`の`-c.extraMetadata.foo=bar`と同じ仕組み）。
      # 認証はAZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET環境変数（Azure.Identityの
      # EnvironmentCredential）をelectron-builder同梱のTrustedSigning PowerShellモジュール
      # （Invoke-TrustedSigning）が読み取る。モジュール自体のインストールはelectron-builder
      # （WindowsSignAzureManager）がビルド時に自動実行するため、本ワークフローでの追加インストールは不要。
      - name: Package Windows installer (Azure Trusted Signing)
        if: steps.check-azure-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          # secretsの値をrunスクリプトへ直接展開せず、すべて環境変数経由で参照する
          # （スクリプトインジェクション対策。GitHub Actionsのハードニング指針に従う）。
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_SIGNING_PUBLISHER_NAME }}
        run: |
          npx electron-builder --win `
            "-c.win.azureSignOptions.endpoint=$env:AZURE_SIGNING_ENDPOINT" `
            "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_SIGNING_ACCOUNT_NAME" `
            "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_CERT_PROFILE_NAME" `
            "-c.win.azureSignOptions.publisherName=$env:AZURE_SIGNING_PUBLISHER_NAME"

      # 署名用Secretsが未設定の場合は従来どおり未署名でビルドする（フォーク等でも失敗させない）。
      - name: Package Windows installer (unsigned)
        if: steps.check-azure-signing.outputs.enabled != 'true'
        run: npx electron-builder --win

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist-electron/*.exe'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: dist-electron/*.exe
          if-no-files-found: error

  build-macos:
    name: macOS Package Build
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      # build-windows と同じ理由で素の `npm ci` を用いる（上記コメント参照）。
      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npm run build:mac

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist-electron/*.dmg
            dist-electron/*.zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-packages
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    timeout-minutes: 15
    # Release作成に必要な書き込み権限。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # 入手者がファイル完全性を検証できるよう、全成果物のSHA256チェックサムを生成する。
      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # SemVerのプレリリース識別子を含むタグ（ハイフン付き、例: v0.1.0-rc.1）は
          # プレリリースとして作成し、通常版のlatestへ誤って露出させない。
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG \
            artifacts/*.exe artifacts/*.dmg artifacts/*.zip artifacts/SHA256SUMS.txt
